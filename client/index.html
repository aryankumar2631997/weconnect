<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>WeConnect Lakhisarai</title>
    <meta name="theme-color" content="#17130F">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-icon">📱</span>
                    <h1>WeConnect</h1>
                </div>
                <p class="subtitle">लखीसराय</p>
            </div>
        </header>

        <main class="main-content">
            <section class="hero-section">
                <h2>आपको क्या चाहिए?</h2>
                <p class="hero-sub">What service do you need?</p>
            </section>

            <section class="categories-grid" id="categoriesContainer">
                <!-- Categories will be loaded by JavaScript -->
                <div class="loading-spinner">Loading...</div>
            </section>
        </main>

        <footer class="app-footer">
            <p>📍 Lakhisarai, Bihar</p>
        </footer>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(console.error);
            });
        }
    </script>
</body>
</html>
