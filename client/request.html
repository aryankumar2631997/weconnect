<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Request Service - WeConnect Lakhisarai</title>
    <meta name="theme-color" content="#17130F">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <button class="back-button" onclick="history.back()">←</button>
                <h2 id="requestTitle">Request Service</h2>
            </div>
        </header>

        <main class="main-content">
            <div class="request-card">
                <div class="service-info" id="serviceInfo">
                    <h3 id="serviceName">Service Name</h3>
                    <p id="serviceCategory">Category</p>
                </div>

                <div class="form-section">
                    <div class="area-section">
                        <label>आपका क्षेत्र / Your Area</label>
                        <div class="area-buttons" id="areaButtons">
                            <button class="area-btn" data-area="Lakhisarai City">Lakhisarai City</button>
                            <button class="area-btn" data-area="Barahiya">Barahiya</button>
                            <button class="area-btn" data-area="Halsi">Halsi</button>
                            <button class="area-btn" data-area="Other">Other</button>
                        </div>
                        <input type="text" id="otherArea" placeholder="Enter your area" style="display:none;">
                    </div>

                    <div class="contact-section">
                        <label>आपका फोन नंबर / Your Phone</label>
                        <input type="tel" id="customerPhone" placeholder="Enter phone number" required>
                    </div>

                    <div class="name-section">
                        <label>आपका नाम / Your Name (optional)</label>
                        <input type="text" id="customerName" placeholder="Enter your name">
                    </div>

                    <div class="description-section">
                        <label>Additional Details</label>
                        <textarea id="description" placeholder="Any special requirements?" rows="2"></textarea>
                    </div>
                </div>

                <div class="action-buttons">
                    <button class="action-btn whatsapp-btn" id="whatsappBtn">
                        <span class="btn-icon">💬</span>
                        WhatsApp
                    </button>
                    <button class="action-btn call-btn" id="callBtn">
                        <span class="btn-icon">📞</span>
                        Call
                    </button>
                </div>

                <div class="lead-confirmation" id="leadConfirmation" style="display:none;">
                    <p>✅ Lead created! Our team will contact you shortly.</p>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/request.js"></script>
</body>
</html>
